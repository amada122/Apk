<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zip to APK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef1f4; --ink: #14202b; --muted: #55626f; --line: #c9d1d9;
    --accent: #1f6f5c; --accent-ink: #fff; --error: #a3261f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 18px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif;
    display: flex; justify-content: center; padding: 40px 20px;
  }
  main { width: 100%; max-width: 520px; }
  h1 { font-size: 2.2rem; line-height: 1.1; margin: 0 0 8px; }
  p.lead { margin: 0 0 24px; color: var(--muted); }
  label { display: block; font-weight: 700; margin: 18px 0 6px; }
  .hint { font-weight: 400; color: var(--muted); font-size: 0.9rem; }
  input[type=text], input[type=password], input[type=file] {
    width: 100%; font: inherit; padding: 12px; background: #fff;
    border: 2px solid var(--line); border-radius: 6px; color: var(--ink);
  }
  details { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 12px; }
  summary { font-weight: 700; cursor: pointer; }
  input:focus-visible, button:focus-visible, a.btn:focus-visible, summary:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  button, a.btn {
    display: inline-block; margin-top: 28px; width: 100%; padding: 14px; font: inherit;
    font-weight: 700; text-align: center; text-decoration: none; color: var(--accent-ink);
    background: var(--accent); border: 0; border-radius: 6px; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: wait; }
  #status { margin-top: 28px; display: none; }
  #step { font-weight: 700; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .bar i { display: block; height: 100%; width: 40%; background: var(--accent); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; } }
  #error { color: var(--error); font-weight: 700; }
  #error a { color: var(--error); }
</style>
</head>
<body>
<main>
  <h1>Turn a web page into an APK</h1>
  <p class="lead">Choose an HTML file, or a zip with your HTML, CSS and JavaScript. You get an Android app to install.</p>

  <label for="file">Your file <span class="hint">(.html or .zip)</span></label>
  <input id="file" type="file" accept=".html,.htm,.zip">

  <label for="name">App name</label>
  <input id="name" type="text" value="My App" maxlength="40">

  <label for="appId">Package name <span class="hint">(optional, like com.yourname.app)</span></label>
  <input id="appId" type="text" placeholder="com.example.myapp">

  <details id="setup" open>
    <summary>GitHub connection</summary>
    <label for="repo">Repository <span class="hint">(your-username/your-repo)</span></label>
    <input id="repo" type="text" placeholder="yourname/zip-to-apk" autocomplete="off">
    <label for="token">Access token <span class="hint">(saved only in this browser)</span></label>
    <input id="token" type="password" autocomplete="off">
  </details>

  <button id="go">Build APK</button>

  <section id="status" aria-live="polite">
    <div id="step"></div>
    <div class="bar" id="bar"><i></i></div>
    <p id="error"></p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const API = 'https://api.github.com';
const sleep = ms => new Promise(r => setTimeout(r, ms));
let H = {};

// Restore saved connection details
try {
  const saved = JSON.parse(localStorage.getItem('zip2apk') || '{}');
  if (saved.repo) $('repo').value = saved.repo;
  if (saved.token) { $('token').value = saved.token; $('setup').open = false; }
} catch (e) {}

async function gh(path, opts = {}) {
  const res = await fetch(API + path, { ...opts, headers: { ...H, ...(opts.headers || {}) } });
  if (!res.ok) {
    let msg = '';
    try { msg = (await res.json()).message; } catch (e) {}
    if (res.status === 401) msg = 'The token was not accepted. Check that it is correct and has not expired.';
    if (res.status === 404) msg = 'Repository or workflow not found. Check the repository name and that build-apk.yml is in it.';
    throw new Error(msg || ('GitHub error ' + res.status));
  }
  return res.status === 204 ? null : res.json();
}

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = () => reject(new Error('Could not read the file.'));
    r.readAsDataURL(file);
  });
}

function setStep(text) { $('step').textContent = text; }

function fail(msg, url) {
  $('error').textContent = msg + ' ';
  if (url) {
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'See the build log';
    $('error').appendChild(a);
  }
  $('bar').style.display = 'none';
  $('go').disabled = false;
}

$('go').addEventListener('click', async () => {
  const file = $('file').files[0];
  const repo = $('repo').value.trim();
  const token = $('token').value.trim();
  if (!file) { alert('Choose an HTML or zip file first.'); return; }
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) {
    $('setup').open = true;
    alert('Fill in your GitHub repository and access token.');
    return;
  }
  try { localStorage.setItem('zip2apk', JSON.stringify({ repo, token })); } catch (e) {}

  const appName = $('name').value.trim() || 'My App';
  const id = [...crypto.getRandomValues(new Uint8Array(4))].map(b => b.toString(16).padStart(2, '0')).join('');
  let appId = $('appId').value.trim().toLowerCase();
  if (!/^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/.test(appId)) appId = 'com.zip2apk.a' + id;

  H = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  const json = { 'Content-Type': 'application/json' };

  $('go').disabled = true;
  $('status').style.display = 'block';
  $('error').textContent = '';
  $('bar').style.display = 'block';
  document.querySelectorAll('a.btn').forEach(a => a.remove());

  try {
    setStep('Checking your repository');
    const info = await gh('/repos/' + repo);
    const branch = info.default_branch;

    setStep('Uploading your file');
    const isZip = /\.zip$/i.test(file.name);
    const fname = isZip ? 'site.zip' : file.name.replace(/[^\w.-]+/g, '_');
    await gh(`/repos/${repo}/contents/uploads/${id}/${fname}`, {
      method: 'PUT', headers: json,
      body: JSON.stringify({ message: 'Upload ' + id, content: await toBase64(file), branch })
    });

    setStep('Starting the build');
    await gh(`/repos/${repo}/actions/workflows/build-apk.yml/dispatches`, {
      method: 'POST', headers: json,
      body: JSON.stringify({ ref: branch, inputs: { app_name: appName, app_id: appId, job_id: id } })
    });

    // Find the run that belongs to this upload
    let run = null;
    for (let i = 0; i < 30 && !run; i++) {
      await sleep(3000);
      const d = await gh(`/repos/${repo}/actions/workflows/build-apk.yml/runs?event=workflow_dispatch&per_page=10`);
      run = d.workflow_runs.find(r => r.display_title === 'Build ' + id);
    }
    if (!run) throw new Error('The build did not start. Open the Actions tab in your repository to check.');

    // Wait for it to finish
    while (true) {
      const r = await gh(`/repos/${repo}/actions/runs/${run.id}`);
      if (r.status === 'completed') {
        if (r.conclusion !== 'success') { fail('The build failed.', r.html_url); return; }
        break;
      }
      setStep(r.status === 'queued' ? 'Waiting for a build machine' : 'Building the APK (a few minutes)');
      await sleep(5000);
    }

    const rel = await gh(`/repos/${repo}/releases/tags/apk-${id}`);
    const asset = rel.assets && rel.assets[0];
    if (!asset) throw new Error('The build finished but the APK was not found.');

    setStep('Your APK is ready');
    $('bar').style.display = 'none';
    const a = document.createElement('a');
    a.className = 'btn';
    a.href = asset.browser_download_url;
    a.textContent = 'Download APK';
    $('status').appendChild(a);
    $('go').disabled = false;
  } catch (e) {
    fail(e.message);
  }
});
</script>
</body>
</html>
